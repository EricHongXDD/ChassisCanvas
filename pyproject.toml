[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "case-screen-controller"
version = "0.1.0"
description = "统一控制微雪与酷冷至尊 USB 机箱监控屏"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "Pillow>=11.0",
  "psutil>=6.0",
  "pyserial>=3.5",
  "hidapi>=0.14",
]

[project.gui-scripts]
case-screen = "case_screen.__main__:main"
case-screen-desktop = "case_screen.__main__:main"

[project.scripts]
case-screen-diagnostics = "case_screen.diagnostics:main"

[tool.setuptools.packages.find]
include = ["case_screen*"]
